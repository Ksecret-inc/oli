<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 대시보드</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --hover: rgba(11,11,11,0.05);
  --up: #006300;
  --down: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --q1: #cde2fb; --q2: #9ec5f4; --q3: #6da7ec; --q4: #3987e5; --q5: #256abf; --q6: #184f95; --q7: #0d366b;
  --focus: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.06);
    --up: #0ca30c; --down: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --focus: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.06);
  --up: #0ca30c; --down: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --focus: #3987e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.sub a { color: inherit; }
.src { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
button { font: inherit; color: inherit; }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.btn:hover { background: var(--hover); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Filters */
.filters { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: grid; gap: 8px; margin-bottom: 16px; }
.frow { display: flex; gap: 12px; align-items: baseline; }
.flabel { flex: 0 0 40px; color: var(--ink-2); font-size: 12px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 1.5px var(--surface); }
.factions { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid var(--border); margin-top: 4px; }
.hint { color: var(--muted); font-size: 12px; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.kpi .k { color: var(--ink-2); font-size: 12px; }
.kpi .v { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi .d .up { color: var(--up); font-weight: 600; }
.kpi .d .down { color: var(--down); font-weight: 600; }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card.full { grid-column: 1 / -1; }
.chead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.chead h2 { font-size: 15px; margin: 0; }
.chead .note { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

svg text { font-family: inherit; }
.axis-label { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.val-label { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.hit { fill: transparent; cursor: pointer; }
.hit:hover, .hit:focus-visible { fill: var(--hover); outline: none; }

/* Bar list */
.blist { display: grid; gap: 4px; }
.brow { display: grid; gap: 4px; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; border: 0; background: transparent; text-align: left; width: calc(100% + 16px); }
.brow:hover { background: var(--hover); }
.brow .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.brow .name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .num { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.brow .num b { color: var(--ink); font-weight: 600; }
.brow .track { height: 10px; }
.brow .bar { height: 10px; border-radius: 0 4px 4px 0; transition: width .25s ease; }
.brow.off { opacity: .35; }
.brow.on .name { font-weight: 600; }

/* Heatmap */
.heat { display: grid; gap: 2px; font-size: 12px; overflow-x: auto; }
.heat .hh { color: var(--ink-2); padding: 4px 6px; font-weight: 600; text-align: center; white-space: nowrap; }
.heat .rh { color: var(--ink); padding: 0 8px 0 0; display: flex; align-items: center; white-space: nowrap; }
.heat .cell { border: 0; border-radius: 4px; height: 44px; cursor: pointer; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; outline-offset: 1px; }
.heat .cell.off { opacity: .3; }
.heat .cell.sel { outline: 2px solid var(--ink); }
.heat .tot { color: var(--ink-2); display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.scale { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 10px; }
.scale .ramp { display: flex; gap: 2px; }
.scale .ramp i { width: 20px; height: 8px; border-radius: 2px; display: block; }

/* Table */
.tablewrap { overflow-x: auto; max-height: 420px; overflow-y: auto; border-top: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--axis); cursor: pointer; user-select: none; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
tbody tr { border-bottom: 1px solid var(--grid); }
tbody tr:hover { background: var(--hover); }
td .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

/* Tooltip */
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.14); min-width: 160px; opacity: 0; transition: opacity .1s; }
#tip.show { opacity: 1; }
#tip .t { font-weight: 650; margin-bottom: 4px; }
#tip .r { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); }
#tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; }
#tip .r b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .r.total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; }
#tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .frow { flex-direction: column; gap: 4px; }
  .flabel { flex: none; }
  .kpi .v { font-size: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>매출 대시보드</h1>
      <div class="sub" id="period">—</div>
    </div>
    <div class="src">
      <span id="status">데이터 불러오는 중…</span>
      <button class="btn" id="reload" type="button">시트에서 새로고침</button>
    </div>
  </header>

  <section class="filters" aria-label="필터">
    <div class="frow"><div class="flabel">월</div><div class="chips" id="f-month"></div></div>
    <div class="frow"><div class="flabel">제품</div><div class="chips" id="f-product"></div></div>
    <div class="frow"><div class="flabel">채널</div><div class="chips" id="f-channel"></div></div>
    <div class="factions">
      <span class="hint" id="fsummary">차트의 막대·셀을 클릭해도 필터가 걸립니다.</span>
      <button class="btn" id="reset" type="button">필터 초기화</button>
    </div>
  </section>

  <section class="kpis" id="kpis"></section>

  <div class="grid">
    <section class="card full">
      <div class="chead">
        <div>
          <h2>월별 매출</h2>
          <div class="note">막대를 클릭하면 해당 월만 선택됩니다</div>
        </div>
        <div class="seg" role="group" aria-label="색상 기준">
          <button type="button" data-by="product" aria-pressed="true">제품별</button>
          <button type="button" data-by="channel" aria-pressed="false">채널별</button>
        </div>
      </div>
      <div class="legend" id="m-legend"></div>
      <div id="monthly"></div>
    </section>

    <section class="card">
      <div class="chead"><div><h2>제품별 매출</h2><div class="note">클릭해서 제품 선택</div></div></div>
      <div class="blist" id="by-product"></div>
    </section>

    <section class="card">
      <div class="chead"><div><h2>채널별 매출</h2><div class="note">클릭해서 채널 선택</div></div></div>
      <div class="blist" id="by-channel"></div>
    </section>

    <section class="card full">
      <div class="chead"><div><h2>제품 × 채널 매출</h2><div class="note">셀을 클릭하면 제품과 채널이 함께 선택됩니다 · 월 필터만 적용</div></div></div>
      <div class="heat" id="heat"></div>
      <div class="scale"><span>낮음</span><span class="ramp" id="ramp"></span><span>높음</span></div>
    </section>

    <section class="card full">
      <div class="chead"><div><h2>상세 데이터</h2><div class="note" id="tcount"></div></div></div>
      <div class="tablewrap"><table id="table"><thead></thead><tbody></tbody></table></div>
    </section>
  </div>
</div>
<div id="tip" role="tooltip"></div>

    }
    const parts = DIMS.filter((d) => sel[d].size).map((d) => `${DIM_KO[d]} ${sel[d].size}개`);
    $('fsummary').textContent = parts.length ? `적용 중: ${parts.join(' · ')}` : '차트의 막대·셀을 클릭해도 필터가 걸립니다.';
  }
  document.querySelector('.filters').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    const d = b.dataset.d;
    if (b.dataset.all) { sel[d].clear(); render(); } else toggle(d, b.dataset.v);
  });
  $('reset').addEventListener('click', () => { DIMS.forEach((d) => sel[d].clear()); render(); });

  // ---------- KPIs ----------
  function renderKPIs() {
    const rows = filtered();
    const rev = total(rows), qty = total(rows, 'qty');
    const list = rows.reduce((a, r) => a + r.price * r.qty, 0);
    const disc = list ? 1 - rev / list : 0;
    const avg = qty ? rev / qty : 0;

    // Month-over-month: last active month vs. the month before it (same product/channel filters)
    const months = sel.month.size ? ORDER.month.filter((m) => sel.month.has(m)) : ORDER.month;
    const last = months[months.length - 1];
    const prev = ORDER.month[ORDER.month.indexOf(last) - 1];
    const base = filtered('month');
    let mom = '';
    if (last && prev) {
      const a = total(base.filter((r) => r.month === last)), b = total(base.filter((r) => r.month === prev));
      if (b) {
        const ch = a / b - 1, up = ch >= 0;
        mom = `<span class="${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${pct(Math.abs(ch))}</span> ${monthKo(last)} 전월 대비`;
      }
    }
    const top = [...sumBy(rows, 'product')].sort((a, b) => b[1] - a[1])[0];
    $('kpis').innerHTML = [
      ['총 매출', short(rev) + '원', mom || won(rev)],
      ['판매수량', nf.format(qty) + '개', `${filtered().length}개 행 합계`],
      ['평균 할인율', pct(disc), `정가 기준 ${short(list - rev)}원 할인`],
      ['최고 매출 제품', top ? top[0] : '—', top ? `${short(top[1])}원 · 비중 ${pct(top[1] / rev)}` : '—'],
    ].map(([k, v, d]) => `<div class="kpi"><div class="k">${k}</div><div class="v" title="${esc(v)}">${esc(v)}</div><div class="d">${d}</div></div>`).join('');
    $('period').innerHTML = `${monthLong(ORDER.month[0])} – ${monthLong(ORDER.month[ORDER.month.length - 1])} · 객단가 ${won(avg)} · <a href="${SHEET_URL}" target="_blank" rel="noopener">원본 시트</a>`;
  }

  // ---------- Monthly stacked columns ----------
  const NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function niceStep(max, n = 4) {
    const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function topRounded(x, y, w, h, r) {
    r = Math.min(r, h, w / 2);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  }
  function renderMonthly() {
    const box = $('monthly');
    const rows = filtered('month');
    const keys = ORDER[colorBy].filter((k) => rows.some((r) => r[colorBy] === k));
    $('m-legend').innerHTML = keys.map((k) => `<span><i style="background:${colorOf(colorBy, k)}"></i>${esc(k)}</span>`).join('');

    const data = ORDER.month.map((m) => {
      const rs = rows.filter((r) => r.month === m);
      const parts = keys.map((k) => ({ k, v: total(rs.filter((r) => r[colorBy] === k)) }));
      return { m, parts, sum: parts.reduce((a, p) => a + p.v, 0) };
    });
    const W = Math.max(300, box.clientWidth), H = 300;
    const M = { l: 52, r: 8, t: 22, b: 28 };
    const pw = W - M.l - M.r, ph = H - M.t - M.b;
    const maxV = Math.max(1, ...data.map((d) => d.sum));
    const step = niceStep(maxV), yMax = Math.ceil(maxV / step) * step;
    const y = (v) => M.t + ph - (v / yMax) * ph;
    const band = pw / data.length, bw = Math.min(44, band * 0.62);

    box.innerHTML = '';
    const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '월별 매출 누적 막대 차트' }, box);
    for (let v = 0; v <= yMax + 1e-6; v += step) {
      svgEl('line', { x1: M.l, x2: W - M.r, y1: y(v), y2: y(v), stroke: v === 0 ? css('--axis') : css('--grid'), 'stroke-width': 1 }, svg);
      svgEl('text', { x: M.l - 8, y: y(v) + 4, 'text-anchor': 'end', class: 'axis-label' }, svg).textContent = v === 0 ? '0' : short(v);
    }
    const peak = data.reduce((a, d) => (d.sum > a.sum ? d : a), data[0]);
    const surface = css('--surface');
    data.forEach((d, i) => {
      const cx = M.l + band * i + band / 2, x = cx - bw / 2;
      const dim = sel.month.size && !sel.month.has(d.m);
      const g = svgEl('g', { opacity: dim ? 0.3 : 1 }, svg);
      let acc = 0;
      const nz = d.parts.filter((p) => p.v > 0);
      nz.forEach((p, j) => {
        const y0 = y(acc), y1 = y(acc + p.v); acc += p.v;
        const isTop = j === nz.length - 1;
        const h = Math.max(0, y0 - y1 - (isTop ? 0 : 2));
        const top = y0 - h;
        if (isTop) svgEl('path', { d: topRounded(x, top, bw, h, 4), fill: colorOf(colorBy, p.k) }, g);
        else svgEl('rect', { x, y: top, width: bw, height: h, fill: colorOf(colorBy, p.k) }, g);
      });
      svgEl('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: 'axis-label', 'font-weight': sel.month.has(d.m) ? 700 : 400 }, svg).textContent = monthKo(d.m);
      if (d === peak && d.sum > 0) svgEl('text', { x: cx, y: y(d.sum) - 6, 'text-anchor': 'middle', class: 'val-label' }, svg).textContent = short(d.sum);

      const hit = svgEl('rect', { x: M.l + band * i, y: M.t, width: band, height: ph, class: 'hit', tabindex: 0, role: 'button', 'aria-label': `${monthLong(d.m)} 매출 ${won(d.sum)}` }, svg);
      const html = () => `<div class="t">${monthLong(d.m)}</div>` +
        [...d.parts].reverse().filter((p) => p.v > 0).map((p) => tipRow(p.k, short(p.v) + '원', colorOf(colorBy, p.k))).join('') +
        tipRow('합계', won(d.sum), null, 'total');
      hit.addEventListener('mousemove', (e) => showTip(e, html()));
      hit.addEventListener('mouseleave', hideTip);
      hit.addEventListener('focus', (e) => showTip(e, html()));
      hit.addEventListener('blur', hideTip);
      hit.addEventListener('click', () => { hideTip(); toggle('month', d.m); });
      hit.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle('month', d.m); } });
    });
  }

  // ---------- Bar lists ----------
  function renderBarList(dim) {
    const rows = filtered(dim);
    const sums = sumBy(rows, dim), qtys = sumBy(rows, dim, 'qty');
    const tot = total(rows) || 1;
    const items = ORDER[dim].map((k) => ({ k, v: sums.get(k) || 0, q: qtys.get(k) || 0 })).sort((a, b) => b.v - a.v);
    const max = Math.max(1, ...items.map((i) => i.v));
    const box = $('by-' + dim);
    box.innerHTML = items.map((i) => {
      const on = sel[dim].has(i.k), off = sel[dim].size && !on;
      return `<button type="button" class="brow ${on ? 'on' : ''} ${off ? 'off' : ''}" data-k="${esc(i.k)}" aria-pressed="${on}">
        <div class="top"><span class="name">${esc(i.k)}</span><span class="num"><b>${short(i.v)}원</b> · ${pct(i.v / tot)}</span></div>
        <div class="track"><div class="bar" style="width:${(i.v / max) * 100}%;background:${colorOf(dim, i.k)}"></div></div>
      </button>`;
    }).join('');
    box.querySelectorAll('.brow').forEach((b) => {
      const it = items.find((i) => i.k === b.dataset.k);
      const html = () => `<div class="t">${esc(it.k)}</div>` + tipRow('매출', won(it.v)) + tipRow('판매수량', nf.format(it.q) + '개') + tipRow('비중', pct(it.v / tot));
      b.addEventListener('mousemove', (e) => showTip(e, html()));
      b.addEventListener('mouseleave', hideTip);
      b.addEventListener('click', () => { hideTip(); toggle(dim, it.k); });
    });
  }

  // ---------- Heatmap ----------
  function renderHeat() {
    const rows = filtered('product', 'channel');
    const P = ORDER.product, C = ORDER.channel;
    const val = (p, c) => total(rows.filter((r) => r.product === p && r.channel === c));
    const vals = P.map((p) => C.map((c) => val(p, c)));
    const flat = vals.flat(), lo = Math.min(...flat), hi = Math.max(...flat);
    const stepOf = (v) => (hi === lo ? 3 : Math.min(6, Math.floor(((v - lo) / (hi - lo)) * 7)));
    const box = $('heat');
    box.style.gridTemplateColumns = `max-content repeat(${C.length}, minmax(72px, 1fr)) minmax(64px, auto)`;
    let h = `<div></div>` + C.map((c) => `<div class="hh">${esc(c)}</div>`).join('') + `<div class="hh">합계</div>`;
    P.forEach((p, i) => {
      h += `<div class="rh">${esc(p)}</div>`;
      C.forEach((c, j) => {
        const v = vals[i][j], s = stepOf(v);
        const isSel = sel.product.has(p) && sel.channel.has(c);
        const off = (sel.product.size && !sel.product.has(p)) || (sel.channel.size && !sel.channel.has(c));
        h += `<button type="button" class="cell ${isSel ? 'sel' : ''} ${off ? 'off' : ''}" data-p="${esc(p)}" data-c="${esc(c)}" data-v="${v}"
          style="background:var(${SEQ[s]});color:${s >= 3 ? '#ffffff' : '#0b0b0b'}" aria-label="${esc(p)} ${esc(c)} ${won(v)}">${short(v)}</button>`;
      });
      h += `<div class="tot">${short(vals[i].reduce((a, b) => a + b, 0))}</div>`;
    });
    h += `<div class="rh" style="color:var(--ink-2);font-weight:600">합계</div>` +
      C.map((c, j) => `<div class="tot">${short(P.reduce((a, p, i) => a + vals[i][j], 0))}</div>`).join('') +
      `<div class="tot" style="font-weight:600;color:var(--ink)">${short(flat.reduce((a, b) => a + b, 0))}</div>`;
    box.innerHTML = h;
    const grand = flat.reduce((a, b) => a + b, 0) || 1;
    box.querySelectorAll('.cell').forEach((b) => {
      const { p, c } = b.dataset, v = +b.dataset.v;
      const html = () => `<div class="t">${esc(p)} · ${esc(c)}</div>` + tipRow('매출', won(v)) + tipRow('전체 대비', pct(v / grand));
      b.addEventListener('mousemove', (e) => showTip(e, html()));
      b.addEventListener('mouseleave', hideTip);
      b.addEventListener('click', () => {
        hideTip();
        const same = sel.product.size === 1 && sel.product.has(p) && sel.channel.size === 1 && sel.channel.has(c);
        sel.product.clear(); sel.channel.clear();
        if (!same) { sel.product.add(p); sel.channel.add(c); }
        render();
      });
    });
    $('ramp').innerHTML = SEQ.map((s) => `<i style="background:var(${s})"></i>`).join('');
  }

  // ---------- Table ----------
  const TCOLS = [
    ['month', '월'], ['product', '제품'], ['channel', '채널'],
    ['qty', '판매수량', true], ['price', '정가', true], ['disc', '할인율', true], ['rev', '매출', true],
  ];
  function renderTable() {
    const rows = filtered().slice().sort((a, b) => {
      const x = a[sort.key], y = b[sort.key];
      return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'ko')) * sort.dir;
    });
    const t = $('table');
    t.tHead.innerHTML = '<tr>' + TCOLS.map(([k, l, n]) =>
      `<th class="${n ? 'num' : ''}" data-k="${k}" tabindex="0" aria-sort="${sort.key === k ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none'}">${l}</th>`).join('') + '</tr>';
    t.tBodies[0].innerHTML = rows.map((r) => `<tr>
      <td>${monthLong(r.month)}</td>
      <td><span class="dot" style="background:${colorOf('product', r.product)}"></span>${esc(r.product)}</td>
      <td><span class="dot" style="background:${colorOf('channel', r.channel)}"></span>${esc(r.channel)}</td>
      <td class="num">${nf.format(r.qty)}</td><td class="num">${nf.format(r.price)}</td>
      <td class="num">${r.disc}%</td><td class="num">${nf.format(r.rev)}</td></tr>`).join('');
    $('tcount').textContent = `${rows.length}개 행 · 합계 ${won(total(rows))} · 머리글을 클릭해 정렬`;
  }
  $('table').addEventListener('click', (e) => {
    const th = e.target.closest('th'); if (!th) return;
    const k = th.dataset.k;
    sort = { key: k, dir: sort.key === k ? -sort.dir : (['qty', 'price', 'disc', 'rev'].includes(k) ? -1 : 1) };
    renderTable();
  });
  $('table').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('th')) e.target.click(); });

  // ---------- Wiring ----------
  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    colorBy = b.dataset.by;
    document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    renderMonthly();
  });
  function render() {
    if (!DATA.length) return;
    renderFilters(); renderKPIs(); renderMonthly(); renderBarList('product'); renderBarList('channel'); renderHeat(); renderTable();
  }
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderMonthly, 120); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

  async function loadLive() {
    $('status').textContent = '시트에서 불러오는 중…';
    try {
      const res = await fetch(LIVE_URL + '&t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const recs = toRecords(await res.text());
      if (!recs.length) throw new Error('empty');
      setData(recs); render();
      const t = new Date();
      $('status').textContent = `실시간 시트 데이터 · ${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')} 기준`;
    } catch (err) {
      $('status').textContent = `시트 연결 실패 – 내장 데이터 사용 (${SEED_DATE} 기준)`;
    }
  }
  $('reload').addEventListener('click', loadLive);

  setData(toRecords($('seed').textContent));
  render();
  $('status').textContent = `내장 데이터 (${SEED_DATE} 기준)`;
  loadLive();
})();
</script>
</body>
</html>
